<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Youtube</title>
<style>
  /* 기본 초기화 및 레이아웃 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Roboto', sans-serif; background-color: #0f0f0f; color: #f1f1f1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { height: 56px; background-color: #0f0f0f; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #303030; }
  .logo { font-size: 20px; font-weight: bold; cursor: pointer; }

  .main-container { display: flex; flex: 1; height: calc(100vh - 56px); position: relative; }
  
  /* 화면 전환용 클래스 */
  .view-section { display: none; flex: 1; height: 100%; overflow-y: auto; padding: 24px; background-color: #0f0f0f; }
  .view-section.active { display: block; }

  /* 1. 채널 리스트 화면 */
  .channel-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
  .channel-card { background-color: #272727; padding: 30px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.2s; }
  .channel-card:hover { background-color: #3f3f3f; }
  .channel-icon { width: 80px; height: 80px; background-color: #ff0000; border-radius: 50%; margin: 0 auto 16px; display: flex; justify-content: center; align-items: center; font-size: 30px; font-weight: bold; }

  /* 2. 채널 상세 (롱폼/숏폼 탭) */
  .channel-header { margin-bottom: 20px; font-size: 24px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
  .back-btn { cursor: pointer; padding: 8px 12px; background-color: #272727; border-radius: 8px; font-size: 14px; display: inline-block; }
  .back-btn:hover { background-color: #3f3f3f; }
  .tabs { display: flex; gap: 20px; margin-bottom: 20px; border-bottom: 1px solid #303030; }
  .tab { padding: 10px 0; cursor: pointer; color: #aaa; font-weight: bold; }
  .tab.active { color: #fff; border-bottom: 3px solid #f1f1f1; }

  /* 영상 그리드 (롱폼) */
  .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .video-card { cursor: pointer; }
  .thumbnail { width: 100%; aspect-ratio: 16 / 9; background-color: #333; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 24px; color: #777;}
  .video-title { margin-top: 10px; font-size: 16px; }

  /* 사진과 같은 숏폼 그리드 (썸네일 목록) */
  .shorts-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
  .short-card { cursor: pointer; display: flex; flex-direction: column; gap: 8px; }
  .short-thumbnail { width: 100%; aspect-ratio: 9 / 16; background-color: #272727; border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 40px; color: #555; transition: border-radius 0.2s; }
  .short-card:hover .short-thumbnail { border-radius: 4px; }
  .short-title { font-size: 14px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* 3. 시청 화면 (롱폼) */
  .watch-container { display: flex; flex-direction: column; max-width: 1200px; margin: 0 auto; }
  .player-wrapper { width: 100%; aspect-ratio: 16 / 9; background-color: #000; border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
  
  /* 4. 시청 화면 (쇼츠 - 세로 스크롤) */
  #shorts-watch-view { padding: 0; background-color: #000; position: relative; }
  .shorts-scroll-container { 
    width: 100%; 
    height: 100%; 
    overflow-y: scroll; 
    scroll-snap-type: y mandatory; /* 스크롤 딱딱 맞추기 */
  }
  /* 스크롤바 숨기기 (선택사항) */
  .shorts-scroll-container::-webkit-scrollbar { display: none; } 
  .shorts-scroll-container { -ms-overflow-style: none; scrollbar-width: none; }

  .short-player-wrapper { 
    width: 100%; 
    height: 100%; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    scroll-snap-align: start; /* 각 요소가 화면 맨 위에서 딱 멈추도록 설정 */
    position: relative;
    padding: 20px 0;
  }
  .short-player-box { 
    width: 100%; 
    max-width: 450px; 
    height: 100%;
    max-height: 90vh; 
    background-color: #121212; 
    border-radius: 16px; 
    overflow: hidden; 
    position: relative;
    box-shadow: 0 0 20px rgba(0,0,0,0.5);
  }
  .short-info-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 30px 20px 20px;
    background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    color: #fff;
    pointer-events: none;
  }
</style>
</head>
<body>

  <header>
    <div class="logo" onclick="renderChannelList()">▶ YouTube 클론</div>
  </header>

  <div class="main-container">
    <!-- 1. 채널 선택 화면 -->
    <div id="channel-list-view" class="view-section active">
      <h2 style="margin-bottom: 20px;">채널 목록</h2>
      <div class="channel-grid" id="channelGrid"></div>
    </div>

    <!-- 2. 채널 내부 화면 (탭 포함) -->
    <div id="channel-detail-view" class="view-section">
      <div class="channel-header">
        <div class="back-btn" onclick="renderChannelList()">← 뒤로</div>
        <span id="currentChannelName">채널 이름</span>
      </div>
      <div class="tabs">
        <div class="tab active" id="tab-video" onclick="switchTab('video')">동영상</div>
        <div class="tab" id="tab-shorts" onclick="switchTab('short')">Shorts</div>
      </div>
      
      <!-- 롱폼 리스트 -->
      <div id="channel-videos" class="video-grid"></div>
      
      <!-- 숏폼 리스트 (사진처럼 그리드로 표시됨) -->
      <div id="channel-shorts" class="shorts-grid" style="display: none;"></div>
    </div>

    <!-- 3. 일반 영상 시청 화면 -->
    <div id="watch-view" class="view-section">
      <div class="back-btn" style="margin-bottom: 20px;" onclick="backToChannel()">← 채널로 돌아가기</div>
      <div class="watch-container">
        <div class="player-wrapper" id="watchPlayer"></div>
        <h2 id="watchTitle">제목</h2>
      </div>
    </div>

    <!-- 4. 쇼츠 시청 화면 (위아래 스크롤) -->
    <div id="shorts-watch-view" class="view-section">
      <div class="back-btn" style="position: absolute; top: 20px; left: 20px; z-index: 100;" onclick="backToChannel()">← 닫기</div>
      <div class="shorts-scroll-container" id="shortsWatchContainer">
        <!-- 스크롤 가능한 쇼츠들이 여기에 추가됨 -->
      </div>
    </div>
  </div>

<script>
  let channelsData = [];
  let currentChannel = null;
  let shortsObserver = null;

  // 1. 서버에서 데이터 로드
async function loadData() {
  try {
    // 서버가 아니라 정적 파일인 data.json을 불러옴
    const res = await fetch('./data.json?t=' + new Date().getTime()); 
    channelsData = await res.json();
    renderChannelList();
  } catch (error) {
    console.error("데이터 로드 실패:", error);
  }
}

  // 2. 화면 전환 로직 (재생 중인 영상 정리 포함)
  function showView(viewId) {
    document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
    
    // 일반 시청 화면을 벗어나면 롱폼 영상 초기화
    if(viewId !== 'watch-view') {
        document.getElementById('watchPlayer').innerHTML = '';
    }
    // 쇼츠 시청 화면을 벗어나면 쇼츠 컨테이너 초기화 (소리 안 겹치게)
    if(viewId !== 'shorts-watch-view') {
        document.getElementById('shortsWatchContainer').innerHTML = '';
        if (shortsObserver) shortsObserver.disconnect(); // 옵저버 해제
    }
  }

  // 3. 채널 목록
  function renderChannelList() {
    showView('channel-list-view');
    const grid = document.getElementById('channelGrid');
    grid.innerHTML = '';
    channelsData.forEach(channel => {
      const card = document.createElement('div');
      card.className = 'channel-card';
      card.onclick = () => openChannel(channel);
      card.innerHTML = `
        <div class="channel-icon">${channel.name.charAt(0)}</div>
        <h3>${channel.name}</h3>
        <p style="color:#aaa; font-size:12px; margin-top:8px;">
          영상 ${channel.videos.length} / 쇼츠 ${channel.shorts.length}
        </p>
      `;
      grid.appendChild(card);
    });
  }

  // 4. 채널 진입
  function openChannel(channel) {
    currentChannel = channel;
    showView('channel-detail-view');
    document.getElementById('currentChannelName').innerText = channel.name;
    switchTab('short'); // 테스트를 위해 숏폼 탭을 기본으로 열고 싶다면 'short', 아니면 'video' 유지
  }

  function backToChannel() {
    if(currentChannel) {
      showView('channel-detail-view');
    } else {
      renderChannelList();
    }
  }

  // 5. 탭 전환 로직
  function switchTab(type) {
    document.getElementById('tab-video').classList.toggle('active', type === 'video');
    document.getElementById('tab-shorts').classList.toggle('active', type === 'short');

    const videoArea = document.getElementById('channel-videos');
    const shortsArea = document.getElementById('channel-shorts');

    if (type === 'video') {
      videoArea.style.display = 'grid';
      shortsArea.style.display = 'none';
      videoArea.innerHTML = '';
      
      currentChannel.videos.forEach(video => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.onclick = () => playVideo(video);
        card.innerHTML = `
          <div class="thumbnail">▶</div>
          <div class="video-title">${video.title}</div>
        `;
        videoArea.appendChild(card);
      });
    } else {
      videoArea.style.display = 'none';
      shortsArea.style.display = 'grid'; // 그리드로 표시
      shortsArea.innerHTML = '';

      // 사진처럼 쇼츠 썸네일 리스트 렌더링
      currentChannel.shorts.forEach((short, index) => {
        const card = document.createElement('div');
        card.className = 'short-card';
        card.onclick = () => openShortsPlayer(index); // 👈 썸네일 클릭 시 해당 인덱스로 재생!
        card.innerHTML = `
          <div class="short-thumbnail">⚡</div>
          <div class="short-title">${short.title}</div>
        `;
        shortsArea.appendChild(card);
      });
    }
  }

  // 6. 롱폼 시청
  function playVideo(video) {
    showView('watch-view');
    document.getElementById('watchTitle').innerText = video.title;
    document.getElementById('watchPlayer').innerHTML = `
      <video controls autoplay style="width: 100%; height: 100%; object-fit: contain;">
        <source src="${video.url}" type="video/mp4">
      </video>
    `;
  }

  // 7. 숏폼 시청 (위아래 스크롤 모드)
  function openShortsPlayer(startIndex) {
    showView('shorts-watch-view');
    const container = document.getElementById('shortsWatchContainer');
    container.innerHTML = '';

    // 해당 채널의 모든 쇼츠를 스크롤 컨테이너에 추가
    currentChannel.shorts.forEach((short, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'short-player-wrapper';
      wrapper.id = `short-wrapper-${index}`;
      
      wrapper.innerHTML = `
        <div class="short-player-box">
          <video class="short-video" controls loop style="width: 100%; height: 100%; object-fit: cover;">
            <source src="${short.url}" type="video/mp4">
          </video>
          <div class="short-info-overlay">
            <h3>${short.title}</h3>
          </div>
        </div>
      `;
      container.appendChild(wrapper);
    });

    // 화면에 보이는 영상만 재생하고 안 보이는 건 멈추는 옵저버 설정
    setupShortsObserver();

    // 클릭한 영상(startIndex) 위치로 스크롤 점프
    setTimeout(() => {
      const targetWrapper = document.getElementById(`short-wrapper-${startIndex}`);
      if(targetWrapper) {
        // 즉시 해당 위치로 스크롤 이동
        container.scrollTo({ top: targetWrapper.offsetTop, behavior: 'instant' });
      }
    }, 50); // DOM 렌더링 후 약간의 딜레이
  }

  // 8. 스크롤 시 자동재생/정지 처리 (Intersection Observer)
  function setupShortsObserver() {
    const options = {
      root: document.getElementById('shortsWatchContainer'),
      rootMargin: '0px',
      threshold: 0.6 // 화면에 60% 이상 보여야 재생
    };

    shortsObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        const video = entry.target.querySelector('.short-video');
        if (entry.isIntersecting) {
          video.play().catch(e => console.log("자동재생 방지됨", e));
        } else {
          video.pause();
          video.currentTime = 0; // 안 보일 땐 처음으로 되감기
        }
      });
    }, options);

    document.querySelectorAll('.short-player-wrapper').forEach(wrapper => {
      shortsObserver.observe(wrapper);
    });
  }

  // 초기 실행
  window.onload = loadData;
</script>
</body>
</html>
